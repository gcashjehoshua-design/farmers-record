<!-- Farmer Directory - HTML Structure -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Directory - Farmers Record System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header-with-back">
            <a href="index.html" class="btn-back">← Back</a>
            <div>
                <h1>👥 Farmer Directory</h1>
                <p>Find and manage all farmer profiles in the system</p>
            </div>
        </header>

        <!-- SEARCH AND FILTERS -->
        <div class="search-section">
            <input 
                type="text" 
                id="farmerSearch" 
                placeholder="Search farmer by name, phone, or farm name..."
                class="search-input"
            >
            <button class="btn-primary" onclick="searchFarmers()">🔍 Search</button>
            <a href="add-farmer.html" class="btn-primary">➕ Add New Farmer</a>
        </div>

        <!-- FARMERS TABLE -->
        <div class="table-section">
            <table class="farmers-table">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Farmer Name</th>
                        <th>Phone</th>
                        <th>Farm Name</th>
                        <th>Member Since</th>
                        <th>Last Visit</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="farmersTableBody">
                    <!-- Populated by JavaScript -->
                    <tr class="loading">
                        <td colspan="7">Loading farmers...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- PAGINATION -->
        <div class="pagination">
            <button id="prevBtn" class="btn-secondary" onclick="previousPage()">← Previous Page</button>
            <span id="pageInfo">Page 1 of 1</span>
            <button id="nextBtn" class="btn-secondary" onclick="nextPage()">Next Page →</button>
        </div>

        <!-- STATS -->
        <div class="stats-section">
            <p>📊 Total Farmers in System: <strong id="totalFarmers">0</strong></p>
            <p>Showing <strong id="showingCount">0</strong> of <strong id="totalCount">0</strong></p>
        </div>
    </div>

    <!-- FARMER PROFILE MODAL -->
    <div id="farmerModal" class="modal hidden">
        <div class="modal-content">
            <span class="modal-close" onclick="closeFarmerModal()">&times;</span>
            <h2>Farmer Profile</h2>
            <div id="farmerDetails"></div>
            <div class="modal-actions">
                <a href="#" id="editFarmerLink" class="btn-secondary">Edit Farmer</a>
                <a href="#" id="newTransactionLink" class="btn-primary">New Transaction</a>
            </div>
        </div>
    </div>

    <script src="js/api-client.js"></script>
    <script src="js/farmer-directory.js"></script>
</body>
</html>
